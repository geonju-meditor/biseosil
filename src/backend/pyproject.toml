[project]
name = "biseosil-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.13",
    "agent-framework-github-copilot>=1.0.1",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.30",
    "azure-monitor-opentelemetry>=1.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false
